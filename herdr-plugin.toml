id = "barnuri.herdr-web"
name = "Herdr Web"
version = "0.1.1"
min_herdr_version = "0.7.0"
description = "Mobile-first web UI for herdr — view and drive panes from a phone, with agent-state notifications"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "install", "--omit=dev"]

[[startup]]
command = ["node", "server.js"]

# herdr spawns [[startup]] processes only when its server boots and never
# restarts one that dies. These hooks re-run an idempotent liveness check so a
# crashed web server heals on the next UI interaction.
[[events]]
on = "pane.focused"
command = ["bash", "scripts/ensure-server.sh"]

[[events]]
on = "tab.created"
command = ["bash", "scripts/ensure-server.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "scripts/ensure-server.sh"]

[[actions]]
id = "open"
title = "Open Herdr Web in browser"
contexts = ["workspace", "pane"]
command = ["node", "bin/open-url.js"]

[[actions]]
id = "show-url"
title = "Show Herdr Web URL"
contexts = ["workspace", "pane"]
command = ["node", "bin/open-url.js", "--notify-only"]
